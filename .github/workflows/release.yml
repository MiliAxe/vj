name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag to release against (e.g. v0.1.0)'
        required: false
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  release-linux:
    name: Build Linux (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            artifact_name: vj
            asset_name: vj-linux-x86_64
            use_cross: false
          - target: aarch64-unknown-linux-gnu
            artifact_name: vj
            asset_name: vj-linux-aarch64
            use_cross: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup cross-compilation toolchain
        if: matrix.use_cross
        uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Release Tarball
        run: |
          mkdir -p package_dir
          cp target/${{ matrix.target }}/release/${{ matrix.artifact_name }} package_dir/
          [ -f README.md ] && cp README.md package_dir/
          [ -f LICENSE ] && cp LICENSE package_dir/
          [ -d assets ] && cp -r assets package_dir/
          cd package_dir
          tar -czvf ../${{ matrix.asset_name }}.tar.gz *
          cd ..

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          files: ${{ matrix.asset_name }}.tar.gz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
