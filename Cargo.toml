[package]
name = "vj"
version = "0.1.0"
edition = "2021"
authors = ["mili"]
description = "Minimal, Ultra-Compressed & Secure Video Journaling in Rust"

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo"] }
clap_complete = "4.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
chrono = "0.4"
tokio = { version = "1.40", features = ["full"] }
axum = { version = "0.7", features = ["multipart"] }
tower-http = { version = "0.5", features = ["cors"] }
local-ip-address = "0.6"
qrcode = "0.14"
notify-rust = "4.11"
which = "6.0"
dialoguer = "0.11"
colored = "2.1"
anyhow = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
